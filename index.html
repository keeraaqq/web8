<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Обратная связь</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="card">
        <h2>Обратная связь</h2>
        <p class="lead">Есть вопрос или предложение? Нажмите кнопку и напишите нам.</p>
        <button type="button" id="open-button">Написать нам</button>
    </main>

    <div class="popup" id="popup" hidden>
        <div class="popup-panel" role="dialog" aria-modal="true" aria-labelledby="popup-title">
            <h2 id="popup-title">Форма обратной связи</h2>
            <button type="button" class="close" id="close-button" aria-label="Закрыть">×</button>

            <form id="feedback-form" action="#">
                <label class="field">
                    <span>ФИО</span>
                    <input type="text" name="fio" autocomplete="name" required>
                </label>
                <label class="field">
                    <span>Email</span>
                    <input type="email" name="email" autocomplete="email" required>
                </label>
                <label class="field">
                    <span>Телефон</span>
                    <input type="tel" name="phone" autocomplete="tel" inputmode="tel" required>
                </label>
                <label class="field">
                    <span>Организация</span>
                    <input type="text" name="organization" autocomplete="organization">
                </label>
                <label class="field">
                    <span>Сообщение</span>
                    <textarea name="message" rows="3" required></textarea>
                </label>
                <label class="consent">
                    <input type="checkbox" name="consent" required>
                    Согласен с политикой обработки персональных данных
                </label>
                <button type="submit" id="send-button">Отправить</button>
                <p class="status" id="status" role="status" aria-live="polite" hidden></p>
            </form>
        </div>
    </div>

    <footer class="main-footer">
        <p>© Авдошина Мария</p>
    </footer>

</body>
</html>
